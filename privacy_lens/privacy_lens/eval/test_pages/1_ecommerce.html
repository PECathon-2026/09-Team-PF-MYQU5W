<!-- PrivacyLens Evaluation Scenario 1: E-Commerce Checkout -->
<!-- Planted PII: 2 credit cards, 1 Aadhaar, 1 PAN, 2 addresses, 1 email, 1 phone -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>SecureShop Checkout</title></head>
<body>
  <h1>SecureShop — Checkout</h1>
  <form id="checkout-form">
    <div class="section">
      <h2>Payment Information</h2>
      <label for="card1">Primary Card:</label>
      <input type="text" id="card1" name="card_number" value="4111-1111-1111-1111" />
      <label for="card2">Backup Card:</label>
      <input type="text" id="card2" name="backup_card" value="5425 2334 3010 9903" />
      <label for="cvv">CVV:</label>
      <input type="password" id="cvv" value="737" />
    </div>
    <div class="section">
      <h2>Personal Details</h2>
      <p>Aadhaar Number: 2345 6789 1234</p>
      <p>PAN: ABCDE1234F</p>
      <label for="email">Email:</label>
      <input type="email" id="email" value="rahul.sharma@example.com" />
      <label for="phone">Phone:</label>
      <input type="tel" id="phone" value="+91-9876543210" />
    </div>
    <div class="section">
      <h2>Shipping Address</h2>
      <textarea id="address">42 MG Road, Indiranagar, Bangalore, Karnataka 560038</textarea>
    </div>
    <button type="submit">Place Order</button>
  </form>
</body>
</html>
